[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sales-analytics-api"
version = "0.1.0"
description = "Sales Analytics API"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",

    "sqlalchemy>=2.0.41",
    "pymysql>=1.1.1",
    "alembic>=1.16.4",

    "polars>=1.31.0",

    "python-multipart>=0.0.20",

    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",

    "loguru>=0.7.3",

    "xlsxwriter>=3.2.5",

    "openpyxl>=3.1.5",
]